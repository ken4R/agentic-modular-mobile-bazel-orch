# CI minimale commune. Chaque POC complète les étapes build dans scripts/build-*.sh
# sans modifier ce fichier, pour que la mesure "durée pipeline PR" soit comparable.
name: ci
on: [pull_request, push]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: chmod +x scripts/*.sh && ./scripts/build-android.sh
      - run: ./scripts/check-architecture.sh
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: chmod +x scripts/*.sh && ./scripts/build-ios.sh
